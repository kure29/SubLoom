proxies:
  - name: 🇭🇰 香港 01 | SS
    type: ss
    server: hk01.example.com
    port: 8388
    cipher: aes-256-gcm
    password: fake-pass-hk01
    udp: true
  - name: 🇭🇰 香港 02 | SS2022
    type: ss
    server: hk02.example.com
    port: 8389
    cipher: 2022-blake3-aes-128-gcm
    password: AAAAAAAAAAAAAAAAAAAAAA==
    udp: true
  - name: 🇹🇼 台湾 01 | Trojan WS
    type: trojan
    server: tw01.example.com
    port: 443
    password: fake-pass-tw01
    udp: true
    sni: tw01.example.com
    network: ws
    ws-opts:
      path: /trws
      headers:
        Host: tw01.example.com
  - name: 🇯🇵 日本 01 | SS+obfs
    type: ss
    server: jp01.example.com
    port: 8443
    cipher: chacha20-ietf-poly1305
    password: fake-pass-jp01
    plugin: obfs
    plugin-opts:
      mode: http
      host: www.bing.com
    udp: true
  - name: 🇯🇵 日本 02 | VMess WS
    type: vmess
    server: jp02.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    servername: jp02.example.com
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vmws
      headers:
        Host: jp02.example.com
  - name: 🇰🇷 韩国 01 | Hysteria2
    type: hysteria2
    server: kr01.example.com
    port: 443
    password: fake-pass-kr01
    obfs: salamander
    obfs-password: fake-obfs-kr01
    udp: true
    sni: kr01.example.com
  - name: 🇸🇬 新加坡 01 | VLESS WS
    type: vless
    server: sg01.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000004
    udp: true
    tls: true
    servername: sg01.example.com
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vlws?ed=2048
      headers:
        Host: sg01.example.com
  - name: 🇸🇬 新加坡 02 | Trojan
    type: trojan
    server: sg02.example.com
    port: 443
    password: fake-pass-sg02
    udp: true
    sni: sg02.example.com
  - name: 🇺🇸 美国 01 | VMess gRPC
    type: vmess
    server: us01.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    servername: us01.example.com
    network: grpc
    grpc-opts:
      grpc-service-name: vmgrpc
  - name: 🇺🇸 美国 02 | VLESS Reality
    type: vless
    server: 203.0.113.10
    port: 443
    uuid: 00000000-0000-4000-8000-000000000003
    flow: xtls-rprx-vision
    udp: true
    tls: true
    servername: www.example.com
    client-fingerprint: chrome
    reality-opts:
      public-key: Zm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm8
      short-id: a1b2c3d4
  - name: 🇩🇪 德国 01 | IPv6
    type: trojan
    server: 2001:db8::10
    port: 443
    password: fake-pass-de01
    udp: true
    sni: de01.example.com
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - DIRECT
    include-all-proxies: true
  - name: 自动选择
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: AI 服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
    include-all-proxies: true
  - name: YouTube
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
    include-all-proxies: true
  - name: 谷歌服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
    include-all-proxies: true
  - name: 电报消息
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
    include-all-proxies: true
  - name: 微软服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选择
    include-all-proxies: true
  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - DIRECT
rule-providers:
  lan:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
    proxy: 节点选择
    interval: 86400
  openai:
    type: http
