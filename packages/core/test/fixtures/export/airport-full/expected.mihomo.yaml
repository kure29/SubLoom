mixed-port: 7890
mode: rule
log-level: info
proxies:
  - name: 剩余流量：98.5 GB
    type: ss
    server: info.example.com
    port: 1
    cipher: aes-128-gcm
    password: info
    udp: false
  - name: 套餐到期：2027-01-01
    type: ss
    server: info.example.com
    port: 2
    cipher: aes-128-gcm
    password: info
    udp: false
  - name: 🇭🇰 香港 01 | SS
    type: ss
    server: hk01.example.com
    port: 8388
    cipher: aes-256-gcm
    password: fake-pass-hk01
    udp: true
  - name: 🇭🇰 香港 02 | SS2022
    type: ss
    server: hk02.example.com
    port: 8389
    cipher: 2022-blake3-aes-128-gcm
    password: AAAAAAAAAAAAAAAAAAAAAA==
    udp: true
  - name: 🇯🇵 日本 01 | SS+obfs
    type: ss
    server: jp01.example.com
    port: 8443
    cipher: chacha20-ietf-poly1305
    password: fake-pass-jp01
    plugin: obfs
    plugin-opts:
      mode: http
      host: www.bing.com
    udp: false
  - name: 🇯🇵 日本 02 | VMess WS
    type: vmess
    server: jp02.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    servername: jp02.example.com
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vmws
      headers:
        Host: jp02.example.com
  - name: 🇺🇸 美国 01 | VMess gRPC
    type: vmess
    server: us01.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    udp: true
    tls: true
    servername: us01.example.com
    network: grpc
    grpc-opts:
      grpc-service-name: vmgrpc
  - name: 🇺🇸 美国 02 | VLESS Reality
    type: vless
    server: 203.0.113.10
    port: 443
    uuid: 00000000-0000-4000-8000-000000000003
    flow: xtls-rprx-vision
    udp: true
    tls: true
    servername: www.example.com
    client-fingerprint: chrome
    reality-opts:
      public-key: Zm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm9vYmFyZm8
      short-id: a1b2c3d4
  - name: 🇸🇬 新加坡 01 | VLESS WS
    type: vless
    server: sg01.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000004
    udp: true
    tls: true
    servername: sg01.example.com
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vlws?ed=2048
      headers:
        Host: sg01.example.com
  - name: 🇸🇬 新加坡 02 | Trojan
    type: trojan
    server: sg02.example.com
    port: 443
    password: fake-pass-sg02
    udp: true
    sni: sg02.example.com
  - name: 🇹🇼 台湾 01 | Trojan WS
    type: trojan
    server: tw01.example.com
    port: 443
    password: fake-pass-tw01
    udp: true
    sni: tw01.example.com
    network: ws
    ws-opts:
      path: /trws
      headers:
        Host: tw01.example.com
  - name: 🇰🇷 韩国 01 | Hysteria2
    type: hysteria2
    server: kr01.example.com
    port: 443
    password: fake-pass-kr01
    obfs: salamander
    obfs-password: fake-obfs-kr01
    udp: true
    sni: kr01.example.com
  - name: 🇩🇪 德国 01 | IPv6
    type: trojan
    server: 2001:db8::10
    port: 443
    password: fake-pass-de01
    udp: true
    sni: de01.example.com
  - name: 🇬🇧 英国 01 | TUIC
    type: tuic
    server: uk01.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000005
    password: fake-pass-uk01
    congestion-controller: bbr
    udp-relay-mode: native
    udp: true
    sni: uk01.example.com
    alpn:
      - h3
  - name: 🇫🇷 法国 01 | AnyTLS
    type: anytls
    server: fr01.example.com
    port: 443
    password: fake-pass-fr01
    udp: true
    sni: fr01.example.com
    client-fingerprint: chrome
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - DIRECT
      - 🇭🇰 香港 01 | SS
      - 🇭🇰 香港 02 | SS2022
      - 🇯🇵 日本 01 | SS+obfs
      - 🇯🇵 日本 02 | VMess WS
      - 🇺🇸 美国 01 | VMess gRPC
      - 🇺🇸 美国 02 | VLESS Reality
      - 🇸🇬 新加坡 01 | VLESS WS
      - 🇸🇬 新加坡 02 | Trojan
      - 🇹🇼 台湾 01 | Trojan WS
      - 🇰🇷 韩国 01 | Hysteria2
      - 🇩🇪 德国 01 | IPv6
      - 🇬🇧 英国 01 | TUIC
      - 🇫🇷 法国 01 | AnyTLS
  - name: 自动选择
    type: url-test
    proxies:
      - 🇭🇰 香港 01 | SS
      - 🇭🇰 香港 02 | SS2022
      - 🇯🇵 日本 01 | SS+obfs
      - 🇯🇵 日本 02 | VMess WS
      - 🇺🇸 美国 01 | VMess gRPC
      - 🇺🇸 美国 02 | VLESS Reality
      - 🇸🇬 新加坡 01 | VLESS WS
      - 🇸🇬 新加坡 02 | Trojan
      - 🇹🇼 台湾 01 | Trojan WS
      - 🇰🇷 韩国 01 | Hysteria2
      - 🇩🇪 德国 01 | IPv6
      - 🇬🇧 英国 01 | TUIC
      - 🇫🇷 法国 01 | AnyTLS
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 故障转移
    type: fallback
    proxies:
      - 🇯🇵 日本 01 | SS+obfs
      - 🇸🇬 新加坡 01 | VLESS WS
      - 🇰🇷 韩国 01 | Hysteria2
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: 香港节点
    type: url-test
    include-all-proxies: true
    filter: (?i)港|hk|hong ?kong
    url: https://www.gstatic.com/generate_204
    interval: 300
rule-providers:
  reject:
    type: http
    behavior: domain
    format: yaml
    url: https://example.com/rules/reject.yaml
    interval: 86400
    path: ./ruleset/reject.yaml
rules:
  - RULE-SET,reject,REJECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN,example-direct.com,DIRECT
  - DOMAIN-KEYWORD,google,节点选择
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - AND,((DOMAIN-SUFFIX,example.org),(DST-PORT,443)),香港节点
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
