[General]
loglevel = info
proxy-test-url = https://www.gstatic.com/generate_204

[Proxy]
剩余流量：98.5 GB = ss, info.example.com, 1, encrypt-method=aes-128-gcm, password=info
套餐到期：2027-01-01 = ss, info.example.com, 2, encrypt-method=aes-128-gcm, password=info
🇭🇰 香港 01 | SS = ss, hk01.example.com, 8388, encrypt-method=aes-256-gcm, password=fake-pass-hk01, udp-relay=true
🇭🇰 香港 02 | SS2022 = ss, hk02.example.com, 8389, encrypt-method=2022-blake3-aes-128-gcm, password=AAAAAAAAAAAAAAAAAAAAAA==, udp-relay=true
🇯🇵 日本 01 | SS+obfs = ss, jp01.example.com, 8443, encrypt-method=chacha20-ietf-poly1305, password=fake-pass-jp01, obfs=http, obfs-host=www.bing.com
🇯🇵 日本 02 | VMess WS = vmess, jp02.example.com, 443, username=00000000-0000-4000-8000-000000000001, vmess-aead=true, ws=true, ws-path=/vmws, ws-headers=Host:jp02.example.com, tls=true, sni=jp02.example.com
🇸🇬 新加坡 02 | Trojan = trojan, sg02.example.com, 443, password=fake-pass-sg02, sni=sg02.example.com
🇹🇼 台湾 01 | Trojan WS = trojan, tw01.example.com, 443, password=fake-pass-tw01, ws=true, ws-path=/trws, ws-headers=Host:tw01.example.com, sni=tw01.example.com
🇰🇷 韩国 01 | Hysteria2 = hysteria2, kr01.example.com, 443, password=fake-pass-kr01, salamander-password=fake-obfs-kr01, sni=kr01.example.com
🇩🇪 德国 01 | IPv6 = trojan, 2001:db8::10, 443, password=fake-pass-de01, sni=de01.example.com
🇬🇧 英国 01 | TUIC = tuic-v5, uk01.example.com, 443, uuid=00000000-0000-4000-8000-000000000005, password=fake-pass-uk01, sni=uk01.example.com, alpn=h3
🇫🇷 法国 01 | AnyTLS = anytls, fr01.example.com, 443, password=fake-pass-fr01, sni=fr01.example.com

[Proxy Group]
节点选择 = select, 自动选择, 故障转移, DIRECT, 🇭🇰 香港 01 | SS, 🇭🇰 香港 02 | SS2022, 🇯🇵 日本 01 | SS+obfs, 🇯🇵 日本 02 | VMess WS, 🇸🇬 新加坡 02 | Trojan, 🇹🇼 台湾 01 | Trojan WS, 🇰🇷 韩国 01 | Hysteria2, 🇩🇪 德国 01 | IPv6, 🇬🇧 英国 01 | TUIC, 🇫🇷 法国 01 | AnyTLS
自动选择 = url-test, 🇭🇰 香港 01 | SS, 🇭🇰 香港 02 | SS2022, 🇯🇵 日本 01 | SS+obfs, 🇯🇵 日本 02 | VMess WS, 🇸🇬 新加坡 02 | Trojan, 🇹🇼 台湾 01 | Trojan WS, 🇰🇷 韩国 01 | Hysteria2, 🇩🇪 德国 01 | IPv6, 🇬🇧 英国 01 | TUIC, 🇫🇷 法国 01 | AnyTLS, interval=300, tolerance=50
故障转移 = fallback, 🇯🇵 日本 01 | SS+obfs, 🇰🇷 韩国 01 | Hysteria2, interval=300
香港节点 = url-test, include-all-proxies=true, policy-regex-filter=(?i)港|hk|hong ?kong, interval=300

[Rule]
DOMAIN-SUFFIX,local,DIRECT
DOMAIN,example-direct.com,DIRECT
DOMAIN-KEYWORD,google,节点选择
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
AND,((DOMAIN-SUFFIX,example.org),(DEST-PORT,443)),香港节点
GEOIP,CN,DIRECT
FINAL,节点选择
