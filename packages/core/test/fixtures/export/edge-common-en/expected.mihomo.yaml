rules:
  - RULE-SET,lan,DIRECT,no-resolve
  - RULE-SET,openai,AI
  - RULE-SET,claude,AI
  - RULE-SET,gemini,AI
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,Google
  - RULE-SET,telegram,Telegram,no-resolve
  - RULE-SET,microsoft,Microsoft
  - GEOIP,CN,DIRECT
  - MATCH,Final
