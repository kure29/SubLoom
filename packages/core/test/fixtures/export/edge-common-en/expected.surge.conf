[General]
proxy-test-url = http://www.gstatic.com/generate_204

[Proxy]
Legacy SS = ss, legacy.example.com, 8388, encrypt-method=aes-128-gcm, password=legacy-pass, udp-relay=true
noname.example.com:8388 = ss, noname.example.com, 8388, encrypt-method=aes-256-gcm, password=noname, udp-relay=true
VMess 数字端口 无TLS = vmess, 198.51.100.20, 10086, username=00000000-0000-4000-8000-000000000006, vmess-aead=true
hy2 别名协议 = hysteria2, hy2.example.com, 443, password=fake-pass-hy2, sni=hy2.example.com, skip-cert-verify=true
Port Hopping = hysteria2, hop.example.com, 20000, password=fake-pass-hop, port-hopping=20000-30000, sni=hop.example.com
Duplicate Name = trojan, dup.example.com, 443, password=fake-pass-dup, sni=dup.example.com
Duplicate Name 2 = trojan, dup2.example.com, 443, password=fake-pass-dup2, sni=dup2.example.com

[Proxy Group]
Proxy = select, Auto, DIRECT, include-all-proxies=true
Auto = url-test, include-all-proxies=true, interval=300, tolerance=50
AI = select, Proxy, Auto, include-all-proxies=true
YouTube = select, Proxy, Auto, DIRECT, include-all-proxies=true
Google = select, Proxy, Auto, DIRECT, include-all-proxies=true
Telegram = select, Proxy, Auto, DIRECT, include-all-proxies=true
Microsoft = select, DIRECT, Proxy, Auto, include-all-proxies=true
Final = select, Proxy, DIRECT

