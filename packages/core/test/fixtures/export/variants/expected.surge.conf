[General]
loglevel = warning
encrypted-dns-server = https://dns.example.com/dns-query
proxy-test-url = http://cp.example.com/generate_204

[Proxy]
SS anchors = ss, ss.example.com, 8388, encrypt-method=aes-128-gcm, password=12e4, udp-relay=true
SS shadow-tls = ss, st.example.com, 443, encrypt-method=2022-blake3-aes-128-gcm, password=AAAAAAAAAAAAAAAAAAAAAA==
Hysteria2 ports = hysteria2, 2001:db8::30, 443, password=fake-hy2, port-hopping=443;20000-30000, download-bandwidth=200, sni=hy.example.com, alpn=h3
TUIC = tuic-v5, tuic.example.com, 443, uuid=00000000-0000-4000-8000-000000000026, password=fake-tuic, sni=tuic.example.com, alpn=h3
AnyTLS = anytls, anytls.example.com, 443, password=fake-anytls, sni=anytls.example.com
HTTP TLS = https, http.example.com, 443, username=fake-user, password=fake-pass, sni=http.example.com
SOCKS5 = socks5, 198.51.100.42, 1080, username=fake-user, password=fake-pass, udp-relay=true

[Proxy Group]
节点选择 = select, 负载均衡, DIRECT, REJECT, SS anchors
负载均衡 = load-balance, TUIC, AnyTLS, interval=300
隐藏组 = fallback, include-all-proxies=true, policy-regex-filter=^(?=.*(?i:hysteria))(?!.*(?:ports)), hidden=true, icon-url=https://icon.example.com/a.png

[Rule]
OR,((NOT,((DOMAIN,a.example.com))),(AND,((DEST-PORT,80),(SRC-IP,10.0.0.0/8)))),DIRECT
AND,((IP-CIDR,198.51.100.0/24,no-resolve),(DEST-PORT,443)),负载均衡
IP-ASN,64500,DIRECT,no-resolve
PROCESS-NAME,curl,DIRECT
SRC-IP,203.0.113.0/24,DIRECT
FINAL,节点选择
