[General]
loglevel = warning
ipv6 = true
dns-server = 223.5.5.5
encrypted-dns-server = https://dns.example.com/dns-query
proxy-test-url = https://cp.example.com/generate_204

[Proxy]
Home SOCKS = socks5, 198.51.100.50, 1080, username=fake-user, password=fake-pass, udp-relay=true
Office HTTP = https, http.example.com, 443, password=fake-pass, sni=http.example.com, skip-cert-verify=true
TUIC = tuic-v5, tuic.example.com, 443, uuid=00000000-0000-4000-8000-000000000051, password=fake-tuic, sni=tuic.example.com, alpn=h3
AnyTLS = anytls, anytls.example.com, 443, password=fake-anytls, tfo=true

[Proxy Group]
Proxy = select, Auto, Fallback, Balance, Home SOCKS, DIRECT, include-all-proxies=true, icon-url=https://icon.example.com/proxy.png
Auto = url-test, include-all-proxies=true, policy-regex-filter=^(?=.*(?i:wg|tuic))(?!.*(?:Office)), interval=300, tolerance=50
Fallback = fallback, TUIC, interval=600, hidden=true
Balance = load-balance, AnyTLS
Block = select, REJECT, REJECT-DROP, DIRECT

[Rule]
RULE-SET,https://rules.example.com/ads.list,Block,update-interval=86400
DOMAIN,direct.example.com,DIRECT
DOMAIN-SUFFIX,example.org,Proxy
DOMAIN-KEYWORD,tracker,REJECT
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
SRC-IP,192.168.50.0/24,Home SOCKS
SRC-IP,fd00::/8,DIRECT
SRC-IP,10.10.0.0/16,Fallback
PROCESS-NAME,curl,Office HTTP
DEST-PORT,22,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy
