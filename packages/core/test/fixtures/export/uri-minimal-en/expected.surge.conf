[General]
proxy-test-url = http://www.gstatic.com/generate_204

[Proxy]
[Demo] 🇭🇰 香港 01 = ss, hk01.example.com, 8388, encrypt-method=aes-256-gcm, password=fake-pass-hk01
[Demo] 🇭🇰 香港 02 = ss, hk02.example.com, 8389, encrypt-method=2022-blake3-aes-128-gcm, password=AAAAAAAAAAAAAAAAAAAAAA==
[Demo] 🇯🇵 日本 01 = ss, jp01.example.com, 8443, encrypt-method=chacha20-ietf-poly1305, password=fake-pass-jp01, obfs=http, obfs-host=www.bing.com
[Demo] 🇯🇵 日本 02 = vmess, jp02.example.com, 443, username=00000000-0000-4000-8000-000000000001, vmess-aead=true, ws=true, ws-path=/vmws, ws-headers=Host:jp02.example.com, tls=true, sni=jp02.example.com

[Proxy Group]
Proxy = select, Auto, DIRECT, include-all-proxies=true
Auto = url-test, include-all-proxies=true, interval=300, tolerance=50

[Rule]
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,Proxy
